{% extends 'base.html' %}
{% block title %} Crete A New Blog Category {% endblock%} 
{% block content %}
<div class="container">
    {% if user.is_authenticated %}
    <h1>Add Category ... </h1>
    <br> <br>
    <div class="col-8">
        <div class="form-group">
            <form method= "POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-outline-primary btn-sm ">Add Category</button>
            </form>
        </div>
    </div>
    {% else %}
    <center>
    <br> <br>
        <h3 class="text-warning ">You are not allowed here ! ( And you know it ... )</h3>
    </center>
    {% endif %}
</div>
{% endblock %}
