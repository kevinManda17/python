{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mes mangas</title>
    <link rel="stylesheet" href="{% static 'global.css' %}">
    <link rel="stylesheet" href="{% static 'manga/css/style.css' %}">
</head>
<body>
    <h1>Welcome on manga channel</h1>
    <ul>
      
        {%for book in books%}
            <li><a href="{% url 'manga:show' book.id %}">{{book.title}}</a></li>
        {%endfor%}
       
    </ul>
    <p><a href="{%url 'manga:add' %}">+ AddBooks</a> | 
        <a href="{%url 'manga:edit' %}">editBooks</a>|
        <a href="{%url 'manga:remove' %}">DeleteBooks</a>
    </p>
</body>
</html>
