{% extends 'base.html' %}
{% block title %} Register {% endblock%} 
{% block content %}
<div class="container">
    <h1>Register </h1>
    <br> <br>
    <div class="col-8">
        <div class="form-group">
            <form method= "POST">
                {% csrf_token %}
                {{ form.as_p }}
                <center>
                    <button class="btn btn-outline-primary ">Register</button>
                </center>
            </form>
        </div>
    </div>
</div>
{% endblock %}
