{% extends 'base.html' %}
{% block title %} Blog Categories  {% endblock%} 

{% block content %}
<div class="container">
    <h1>Blog Category...</h1>
    <br>
    <center class= " col-4 ">
    {% for item in cat_menu_list %}
        <h4><a href="{% url 'category' item|slugify %}" class="text-dark ">
            {{item}}
        </a></h4>
    {% endfor %}
    </center>
</div>
{% endblock %}
