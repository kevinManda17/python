{% extends 'base.html' %}
{% block title %} Create Profile  Page {% endblock%} 
{% block content %}
<div class="container">
    {% if user.is_authenticated %}
    <h1>Create profile Page </h1>
    <br> <br>
    <div class="col-8">
        <div class="form-group">
            <form method= "POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{form.media }}
                {{ form.as_p }}
                <center>
                <button class="btn btn-outline-secondary"> Post</button>
                </center>
            </form>
        </div>
    </div>
    {% else %}
    <center>
    <br> <br>
        <h3 class="text-warning ">You are not allowed here ! ( <p class="text-danger">And you know it ...</p>  )</h3>
    </center>
    {% endif %}
</div>
{% endblock %}
