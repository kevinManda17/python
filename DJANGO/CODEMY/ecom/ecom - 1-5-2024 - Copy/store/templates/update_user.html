{% extends 'base.html' %}

{% block content %}
    <!-- Header-->
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Update Profile </h1>
            <p class="lead fw-normal text-white-50 mb-0">Update User Profile ...</p>
        </div>
    </div>
    </header> 
    <div class="container">
        <div class="row py-3 px-3 ">
            <div class="col-md-4">   <a href="{% url 'update-password'%}" class=" text-dark btn btn-outline-secondary btn-sm col-md-3 "> Update Password</a></div>
        </div>
        <div class="row">
        <div class="col-md-6 offset-md-3">
            <br><br>
            <br><br>
            <form method="POST" action="{% url 'update-user' %}">
                    {% csrf_token %}
                    {{user_form.as_p}}
                    <br><br>
                    <center>
                        <button type="submit" class="btn btn-secondary">
                            Update Profile 
                        </button>
                        <br><br><br>
                    </center>
            </form>
            
        </div>
        </div>
    </div>
{% endblock %}
