{%load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body>

<div class= "container p-3   col-6   pt-5">

          <p>


            <h1>Some test about sending email :</h1>



            name :  {{ name }} ,
            email: {{ email }} ,
            with a message : {{ message }} .
          </p>

            <br>     <br>     <br>   


      <form action="{% url 'contact' %}"   method ="POST" > 
            {% csrf_token %}

                <div class="mb-3">
                  <label for="idName" class="form-label">Your name </label>
                  <input type="text" class="form-control"  name="message_name" id="idName" placeholder="Your name ">
                </div>

                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Email address</label>
                  <input type="email" class="form-control" name="message_email" id="exampleFormControlInput1" placeholder="name@example.com">
                </div>

                <div class="mb-3">
                  <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
                  <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"   name="message" ></textarea>

                </div>

              <div class="mb-3">

                  <center>
                    <button type="submit" class =" btn btn-outline-primary ">Send message here </button>
                  </center>

              </div>
      </form>

      <br>     <br>     <br>

  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
