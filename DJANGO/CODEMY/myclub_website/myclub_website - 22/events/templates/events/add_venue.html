{% extends 'events/base.html' %}

{% block content %}
    <center>
       
        <h1>Add Venue To Database </h1>
        &emsp;
        {% if submitted %}

          <p>  Your Venue Was Submitted succeFully !!! </p> <br><br>

            <a href="{% url 'list-venues' %}" class="btn btn-outline-primary">Going Back to List venues</a>

                        {{form.as_p}}

        {% endif%}    
    </center> 

{% endblock %}
